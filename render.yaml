# Render deployment manifest for the SwarAI FastAPI backend (Free Web Service).
# Deploy: push this repo to GitHub, then "New > Web Service" -> connect repo,
# or use `render blueprint launch` after authenticating with `render`.
#
# Build/start commands match the project's deployment contract:
#   build:  pip install -r backend/requirements.txt
#   start:  python -m uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
#
# Env vars marked `sync: false` must be set in the Render dashboard:
#   - CORS_ORIGINS: the exact Vercel HTTPS origin(s), comma-separated
#                   (e.g. https://swarai.vercel.app)
#   - GEMINI_API_KEY / GROQ_API_KEY: only if you want live AI providers,
#     otherwise the backend safely falls back to the mock tutor.
services:
  # 1. FastAPI Backend (Audio Analysis & AI Tutor API)
  - type: web
    name: swarai-audio-analysis
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: CORS_REFLECT_LAN
        value: "false"
      - key: CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: AI_MOCK_FALLBACK_ENABLED
        value: "true"
      - key: BASIC_PITCH_ENABLED
        value: "false"

  # 2. Next.js Frontend (Visual Piano & Tutor UI)
  - type: web
    name: swarai-frontend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_AUDIO_API_URL
        sync: false
